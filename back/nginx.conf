server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Compression (ok aunque Caddy ya comprima) ---
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    text/css
    text/plain
    text/xml
    image/svg+xml;

  # --- Flutter "app shell": NO cache fuerte (evita users pegados a versiones viejas) ---
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache" always;
  }

  location = /version.json {
    add_header Cache-Control "no-cache" always;
  }

  # Flutter loader / runtime: mejor revalidar
  location = /main.dart.js {
    add_header Cache-Control "no-cache" always;
  }

  location = /flutter.js {
    add_header Cache-Control "no-cache" always;
  }

  # --- Assets pesados: cache largo e immutable ---
  location ^~ /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /canvaskit/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Imágenes / fonts / wasm: cache largo
  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|wasm)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # CSS/JS generales (si existieran otros): cache corto, SIN immutable
  location ~* \.(?:js|css)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # JSON suelto (manifest, etc): cache corto
  location ~* \.json$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # --- Proxy específico (tu caso) ---
  location ^~ /site-identity/icons/ {
    proxy_pass http://backend:3000/site-identity/icons/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- SPA routing: para rutas tipo /fixture, /equipos, etc ---
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
