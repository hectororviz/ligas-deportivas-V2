services:
  db:
    image: postgres:15-alpine
    container_name: ligas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ligas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ligas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hectororviz/ligas-deportivas-v2/backend}:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ligas
      DB_SCHEMA_ENFORCEMENT: ${DB_SCHEMA_ENFORCEMENT:-strict}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-storage:/app/storage
    networks:
      - default
      - caddy_net

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/hectororviz/ligas-deportivas-v2/backend}:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ligas
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/entrypoint-migrate.sh"]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/hectororviz/ligas-deportivas-v2/frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - caddy_net
    labels:
      caddy: ligas.csdsoler.com.ar
      caddy.0_handle: /storage/*
      caddy.0_handle.0_reverse_proxy: backend:3000
      caddy.1_handle: /api/*
      caddy.1_handle.0_reverse_proxy: backend:3000
      caddy.2_handle: /site-identity/*
      caddy.2_handle.0_reverse_proxy: backend:3000
      caddy.3_handle: /*
      caddy.3_handle.0_reverse_proxy: "{{upstreams 3000}}"

volumes:
  postgres-data:
  backend-storage:

networks:
  caddy_net:
    external: true
